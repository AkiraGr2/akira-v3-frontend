<script>
/* AKIRA EARLY CACHE RECOVERY
 * Retire any legacy service worker/cache before the application modules boot.
 * sw.js is intentionally kept in the repository as a kill-switch target so
 * old registrations can update and unregister themselves.
 */
(function(){
  try{
    if("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations){
      navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all(regs.map(function(r){
          try{return r.unregister();}catch(_){return false;}
        }));
      }).then(function(){
        if(window.caches && caches.keys){
          return caches.keys().then(function(keys){
            return Promise.all(keys.map(function(k){return caches.delete(k);}));
          });
        }
      }).catch(function(){});
    } else if(window.caches && caches.keys){
      caches.keys().then(function(keys){
        return Promise.all(keys.map(function(k){return caches.delete(k);}));
      }).catch(function(){});
    }
  }catch(_){}
})();
</script>

<script>
/* AKIRA CACHE GUARD
 * GitHub Pages may serve an older index from browser/CDN cache. The guard asks
 * for a cache-busted build manifest before the app boots; on mismatch it moves
 * to a versioned URL so the browser must fetch the current index and assets.
 */
(function(){
  var PARAM="akira_build";
  var current="";
  try{
    var u=new URL(window.location.href);
    current=u.searchParams.get(PARAM)||"";
  }catch(_){}

  fetch("./build-version.json?t="+Date.now(),{
    cache:"no-store",
    credentials:"same-origin"
  }).then(function(r){
    if(!r.ok) throw new Error("manifest "+r.status);
    return r.json();
  }).then(function(m){
    var latest=String(m&&m.version||"").trim();
    if(!latest || latest===current) return;
    var u=new URL(window.location.href);
    u.searchParams.set(PARAM,latest);
    window.location.replace(u.toString());
  }).catch(function(){});
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0b0e;--sidebar:rgba(18,18,22,0.95);--border:#2a2a36;--text:#ececf1;--muted:#8a8a93;--accent:#6366f1;--coral:#FF6B6B;--mint:#6BCF7F;--sky:#4ECDC4;--lemon:#FFD93D;--lilac:#a78bfa;--peach:#FFA07A;}
body{background:var(--bg);color:var(--text);font-family:'Pixelify Sans', sans-serif;height:100dvh;overflow:hidden;display:flex;}
.pixel-border{border:3px solid var(--border);box-shadow:3px 3px 0 rgba(0,0,0,0.2),inset -3px -3px 0 rgba(0,0,0,0.4);}
.pixel-btn{font-family:'Press Start 2P', monospace;border:3px solid var(--border);background:#1e1e26;padding:10px 12px;border-radius:0;cursor:pointer;transition:all 0.1s ease;box-shadow:3px 3px 0 rgba(0,0,0,0.3);text-transform:uppercase;font-size:10px;line-height:1.4;color:#fff;}
.pixel-btn:active{transform:translate(3px,3px);box-shadow:none;}
.pixel-btn:hover{background:#2a2a36;}
.sidebar{width:280px;min-width:280px;background:var(--sidebar);border-right:3px solid var(--border);display:flex;flex-direction:column;padding:12px;gap:8px;z-index:20;transition:transform .3s ease;}
.brand{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:3px solid var(--border);padding-bottom:12px;}
.orb{width:36px;height:36px;background:radial-gradient(circle at 30% 25%, var(--mint) 0%, var(--accent) 55%, var(--lilac) 90%);box-shadow:0 0 0 3px var(--border),0 0 20px rgba(99,102,241,.45);border-radius:50%;}
.brand h1{font-family:'Press Start 2P', monospace;font-size:12px;font-weight:400}
.brand p{font-size:11px;color:var(--muted)}
.btn-new{display:flex;align-items:center;gap:8px;background:var(--accent);border:3px solid var(--border);color:#fff;padding:12px;font-size:12px;cursor:pointer;width:100%;font-family:'Press Start 2P', monospace;font-weight:400;box-shadow:3px 3px 0 rgba(0,0,0,0.3);border-radius:0;}
.btn-new:hover{background:#4f52c9;}
.btn-new:active{transform:translate(3px,3px);box-shadow:none;}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:3px solid transparent;color:var(--muted);font-size:12px;cursor:pointer;background:transparent;width:100%;text-align:left;font-family:'Press Start 2P', monospace;border-radius:0;transition:all 0.1s ease;}
.nav-btn:hover{background:#1c1c22;color:var(--text);}
.nav-btn.active{background:#1e1e26;color:#fff;border-color:var(--border);box-shadow:inset 3px 3px 0 rgba(0,0,0,0.3),inset -3px -3px 0 rgba(0,0,0,0.1);}
.history{flex:1;overflow-y:auto;margin-top:12px;display:flex;flex-direction:column;gap:2px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(900px 400px at 50% -10%, rgba(99,102,241,.12), transparent), var(--bg);min-width:0}
