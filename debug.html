<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Debug Akira</title>
<style>body{background:#0b0b0e;color:#ececf1;font-family:monospace;padding:16px;font-size:12px}pre{background:#16161b;padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-word;margin:8px 0}button{background:#6366f1;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;margin:4px}button.alt{background:#ef4444}</style>
</head><body>
<h3>Diagnóstico Akira</h3>
<button class="alt" onclick="killSW()">🗑️ Desregistrar SW</button>
<button onclick="run()">▶️ Ejecutar diagnóstico</button>
<pre id="out">Toca el botón.</pre>
<script>
function log(msg){const o=document.getElementById('out');o.textContent+='\n'+msg;}

async function killSW(){
  const o=document.getElementById('out');
  o.textContent='🗑️ Matando Service Workers...';
  if(!('serviceWorker' in navigator)){o.textContent+='\nNo hay SW.';return;}
  try{
    const regs=await navigator.serviceWorker.getRegistrations();
    if(regs.length===0){o.textContent+='\nNo hay SW registrados.';}
    for(const r of regs){ await r.unregister(); o.textContent+='\nDesregistrado: '+r.scope; }
    const keys=await caches.keys();
    for(const k of keys){ await caches.delete(k); o.textContent+='\nCache borrado: '+k; }
    o.textContent+='\n\nRecarga la página y vuelve a iniciar sesión.';
  }catch(e){o.textContent+='\n❌ '+e.message;}
}

async function run(){
  const o=document.getElementById('out');o.textContent='';
  const backend='https://akira-empresa.onrender.com';
  log('Backend: '+backend);

  // SW activos
  if('serviceWorker' in navigator){
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      log('1b) SW activos: '+regs.length);
    }catch(e){log('1b) SW error: '+e.message);}
  } else {
    log('1b) SW: no soportado');
  }

  // Health
  try{
    const r=await fetch(backend+'/health',{cache:'no-store'});
    log('2) /health: '+r.status);
  }catch(e){log('2) ❌ '+e.message);}

  // Agents sin auth
  try{
    const r=await fetch(backend+'/api/v8/agents',{cache:'no-store'});
    log('3) /agents sin auth: '+r.status);
  }catch(e){log('3) ❌ '+e.message);}

  // Token
  const t=localStorage.getItem('akira_session_token');
  const exp=parseInt(localStorage.getItem('akira_session_exp')||'0',10);
  const now=Math.floor(Date.now()/1000);
  log('4) token: '+(t?'existe':'NO')+' | válido: '+(t && exp>now ? 'SÍ' : 'NO'));

  // ===== PREFLIGHT TEST =====
  log('');
  log('--- PREFLIGHT OPTIONS ---');
  try{
    const r = await fetch(backend+'/api/v8/agents', {
      method: 'OPTIONS',
      headers: {
        'Access-Control-Request-Method': 'GET',
        'Access-Control-Request-Headers': 'authorization, content-type'
      }
    });
    log('status: '+r.status);
    log('allow-origin: '+r.headers.get('access-control-allow-origin'));
    log('allow-methods: '+r.headers.get('access-control-allow-methods'));
    log('allow-headers: '+r.headers.get('access-control-allow-headers'));
    log('max-age: '+r.headers.get('access-control-max-age'));
  }catch(e){
    log('❌ PREFLIGHT FALLÓ: '+e.message);
    log('   name: '+e.name);
  }

  // ===== GET CON AUTH =====
  log('');
  log('--- GET con Authorization ---');
  try{
    const h={'Content-Type':'application/json'};
    if(t && exp>now) h['Authorization']='Bearer '+t;
    const r=await fetch(backend+'/api/v8/agents',{headers:h,cache:'no-store'});
    log('status: '+r.status);
    const j=await r.json();
    log('respuesta: '+JSON.stringify(j).slice(0,300));
    if(j.ok) log('✅ FUNCIONA: '+(j.count||0)+' agentes');
  }catch(e){log('❌ FALLÓ: '+e.message);}

  log('');
  log('FIN.');
}
</script>
</body></html>
