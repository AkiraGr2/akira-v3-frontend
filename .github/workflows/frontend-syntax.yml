name: Frontend syntax verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Brain and Learning JavaScript
        run: |
          node --check js/akira_brain_3d.js
          node --check js/obsidian_membrane.js
          node --check js/akira_learning.js
          node --check js/akira_brain.js
          node --check js/akira_missions_panel.js
          node --check js/akira_admin.js
          node --check js/akira_extras.js
          node --check js/akira-office-floor-v2.js

      - name: Guard verified learning evaluation action
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("js/akira_learning.js", "utf8");
          const start = text.indexOf('}else if(status === "verified"){');
          const end = text.indexOf('}else if(status === "consolidated"){', start);
          if (start < 0 || end < 0) throw new Error("verified/consolidated blocks not found");
          const block = text.slice(start, end);
          if (!block.includes('data-learning-action="evaluate"')) {
            throw new Error("verified learning must expose EVALUAR when not sufficiently evaluated");
          }
          if (!block.includes('confidence < 0.70')) {
            throw new Error("verified learning evaluate gate threshold missing");
          }
          console.log("verified learning evaluation action guard OK");
          NODE

      - name: Guard Cognitive Workspace V2 visual contract
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const index = fs.readFileSync("index.html", "utf8");
          const css = fs.readFileSync("css/akira-cognitive-workspace-v2.css", "utf8");
          const contract = fs.readFileSync("AKIRA_UI_CONTRACT_V2.md", "utf8");
          if (!index.includes("css/akira-cognitive-workspace-v2.css")) throw new Error("Cognitive Workspace V2 stylesheet must be loaded");
          if (!css.includes("--bg:#080b12")) throw new Error("V2 design token set missing");
          if (!css.includes(".sidebar")) throw new Error("V2 workspace shell rules missing");
          if (!css.includes("@media(max-width:768px)")) throw new Error("mobile-first rules missing");
          if (!contract.includes("Akira Cognitive Workspace")) throw new Error("UI contract missing");
          if (!contract.includes("Este rediseño es visual; no debe cambiar APIs, persistencia, permisos ni comportamiento de negocio.")) throw new Error("UI contract must protect backend contracts");
          if (!index.includes("js/akira-office-floor-v2.js")) throw new Error("living cognitive office script must be loaded");
          if (!index.includes("Oficina Cognitiva")) throw new Error("cognitive office surface missing");
          if (!css.includes(".office-v2-stage")) throw new Error("living office visual rules missing");
          console.log("Cognitive Workspace V2 visual contract OK");
          NODE

      - name: Guard runtime capability truth surface
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("index.html", "utf8");
          if (!text.includes("/api/v8/runtime/capabilities")) throw new Error("runtime capability endpoint must be consumed by frontend");
          if (!text.includes("function fetchRuntimeCapabilities()")) throw new Error("runtime capability fetch helper missing");
          if (!text.includes("window.akiraRuntimeCapabilities")) throw new Error("runtime capability state missing");
          if (!text.includes("runtimeStatus(runtime && runtime.image && runtime.image.status)")) throw new Error("image status must derive from runtime");
          if (!text.includes("runtimeStatus(runtime && runtime.pdf && runtime.pdf.status)")) throw new Error("pdf status must derive from runtime");
          if (!text.includes("runtimeStatus(runtime && runtime.video && runtime.video.status)")) throw new Error("video status must derive from runtime");
          console.log("runtime capability truth surface guard OK");
          NODE

      - name: Guard PDF upload error truthfulness
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("js/akira_extras.js", "utf8");
          const start = text.indexOf("async function uploadFileToAkira");
          const end = text.indexOf("\n// -------- 📝 Crear archivo --------", start);
          if (start < 0 || end < 0) throw new Error("uploadFileToAkira block not found");
          const block = text.slice(start, end);
          if (!block.includes("if(!r.ok || !d || d.ok !== true)")) throw new Error("PDF handler must reject non-2xx or non-ok backend responses");
          if (!block.includes("typeof d.text !== \"string\"")) throw new Error("PDF handler must validate returned text");
          if (!block.includes("d.message || d.reason")) throw new Error("PDF handler must surface backend reason");
          console.log("PDF upload error truthfulness guard OK");
          NODE



      - name: Guard capability registry consumption contract
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const index = fs.readFileSync("index.html", "utf8");
          const start = index.indexOf("async function renderLevels");
          const end = index.indexOf("\n</script>", start);
          if (start < 0 || end < 0) throw new Error("renderLevels block not found");
          const block = index.slice(start, end);
          if (!block.includes("d.capabilities_registry")) throw new Error("renderLevels must read capabilities_registry");
          if (!block.includes("effective_state")) throw new Error("renderLevels must use effective capability state");
          if (!block.includes("legacyCapabilities.find")) throw new Error("per-capability legacy fallback missing");
          if (!block.includes("if (c)")) throw new Error("registry entry must take precedence over legacy fallback");
          if (!block.includes("const legacyStatus = legacy && legacy.status")) throw new Error("legacy status fallback missing");
          console.log("Capability registry consumption guard OK");
          NODE

      - name: Guard Brain count authorization contract
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const index = fs.readFileSync("index.html", "utf8");
          const syncStart = index.indexOf("async function forceSyncR2");
          const syncEnd = index.indexOf("\nfunction exportBackup", syncStart);
          const countStart = index.indexOf("async function countNeuronas");
          const countEnd = index.indexOf("\ndocument.addEventListener", countStart);
          if (syncStart < 0 || syncEnd < 0) throw new Error("forceSyncR2 block not found");
          if (countStart < 0 || countEnd < 0) throw new Error("countNeuronas block not found");
          const syncBlock = index.slice(syncStart, syncEnd);
          const countBlock = index.slice(countStart, countEnd);
          for (const [name, block] of [["forceSyncR2", syncBlock], ["countNeuronas", countBlock]]) {
            if (!block.includes("akiraAuthHeaders()")) throw new Error(name+" must use signed session headers");
            if (!block.includes("akiraHandleAuthFailure(401)")) throw new Error(name+" must invalidate session on 401");
          }
          console.log("Brain count authorization guard OK");
          NODE

      - name: Guard signed-session UX contract
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const index = fs.readFileSync("index.html", "utf8");
          const admin = fs.readFileSync("js/akira_admin.js", "utf8");
          const missions = fs.readFileSync("js/akira_missions_panel.js", "utf8");
          const learning = fs.readFileSync("js/akira_learning.js", "utf8");
          const extras = fs.readFileSync("js/akira_extras.js", "utf8");
          const brain = fs.readFileSync("js/akira_brain.js", "utf8");
          if (!index.includes("function akiraVerifySession()")) throw new Error("central session verifier missing");
          if (!index.includes("function akiraClearSession(reason)")) throw new Error("central session clear helper missing");
          if (!index.includes("function akiraHandleAuthFailure(status)")) throw new Error("central 401 handler missing");
          if (!index.includes("/api/v8/me")) throw new Error("frontend session verifier must use /api/v8/me");
          if (index.includes('localStorage.setItem("akira_is_owner"')) throw new Error("owner state must not be persisted as local authority");
          if (index.includes('localStorage.getItem("akira_is_owner"')) throw new Error("owner state must not be read from localStorage");
          if (missions.includes("localStorage.getItem(\"akira_token\")") || missions.includes("localStorage.getItem(\"token\")") || missions.includes("localStorage.getItem(\"access_token\")")) throw new Error("mission panel must not use generic token fallbacks");
          if (!admin.includes("window.akiraVerifySession")) throw new Error("restored session must be verified against backend");
          if (!admin.includes("window.akiraHandleAuthFailure(401)")) throw new Error("admin must invalidate session on HTTP 401");
          for (const [name,text] of [["learning",learning],["extras",extras],["brain",brain]]) {
            if (!text.includes("akiraHandleAuthFailure(401)")) throw new Error(name+" must invalidate session on HTTP 401");
          }
          if (!index.includes('"akira_is_owner"') || !index.includes("localStorage.removeItem(k)")) throw new Error("legacy owner flag should be actively purged");
          const adminStart = index.indexOf('<div id="adminSection" class="section">');
          const adminEnd = index.indexOf('\n<script>\nif(!localStorage.getItem("akira_backend_url"))', adminStart);
          if (adminStart < 0 || adminEnd < 0) throw new Error("admin section boundaries not found");
          const adminHtml = index.slice(adminStart, adminEnd);
          for (const forbidden of ["Panel Técnico Akira","Tool Registry","Self-Model","Ciclo Cognitivo","verificar sesión de propietario"]) {
            if (adminHtml.includes(forbidden)) throw new Error("admin UI still exposes technical label: " + forbidden);
          }
          for (const required of ["Control de Akira","Actualizar estado de Akira","Ver qué sabe Akira sobre sí misma","Ver todos los agentes y su estado","Abrir el centro de Misiones"]) {
            if (!adminHtml.includes(required)) throw new Error("owner-friendly admin label missing: " + required);
          }
          if (!admin.includes("adminAddSelfNote")) throw new Error("plain-language self-knowledge action missing");
          console.log("owner-friendly admin UI guard OK");
          console.log("signed-session UX contract guard OK");
          NODE

      - name: Guard interactive UI integrity
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const index = fs.readFileSync("index.html", "utf8");
          const office = fs.readFileSync("js/akira-office-floor-v2.js", "utf8");
          const missions = fs.readFileSync("js/akira_missions_panel.js", "utf8");

          if (!index.includes("function saveKey()")) throw new Error("saveKey handler missing");
          if (!index.includes("function testKeys()")) throw new Error("testKeys handler missing");
          if (!index.includes('localStorage.setItem("akira_user_key",key)')) throw new Error("API key persistence handler missing");
          if (!index.includes("id=\"f8Output\" class=\"admin-v2-output\"")) throw new Error("tool result surface missing");
          if (!index.includes('id:"F8", name:"Herramientas de Akira"')) throw new Error("level F8 must use owner-friendly label");
          if (index.includes("12 herramientas registradas")) throw new Error("stale tool count remains");
          if (index.includes("Google o Groq")) throw new Error("UI must not promise unsupported Groq user-key flow");

          if (!office.includes("const POLL_MS = 8000")) throw new Error("office polling interval missing");
          if (!office.includes("window.setInterval")) throw new Error("office live polling is not scheduled");
          if (!office.includes('current.classList.contains("active")')) throw new Error("office polling must respect section visibility");
          if (!office.includes("const renderTs=paused ? lastTs : ts")) throw new Error("office pause must freeze visual time");
          if (!office.includes("if(ar.ok || tr.ok) lastPoll=Date.now()")) throw new Error("office sync timestamp must represent a successful read");

          if (!missions.includes('setMissionActionBusy(id, "execute")')) throw new Error("mission execution lock missing");
          if (!missions.includes('actionBusyFor(id, "execute") ? "disabled" : ""')) throw new Error("mission execute button must disable while busy");
          if (!missions.includes('updated?.status !== "running"')) throw new Error("mission execution lock must be released at terminal state");
          const brain = fs.readFileSync("js/akira_brain.js", "utf8");
          if (/^function\\s+renderLevels\\s*\\(/m.test(brain)) throw new Error("legacy brain.js renderLevels must not override the authoritative levels renderer");
          if ((index.match(/function\\s+renderLevels\\s*\\(/g) || []).length !== 1) throw new Error("exactly one authoritative renderLevels function is expected");
          if (index.includes('user-scalable=no')) throw new Error("mobile UI must not disable user zoom");
          const sync = fs.readFileSync("js/hybrid_sync.js", "utf8");
          if (!sync.includes("window.akiraAuthHeaders()")) throw new Error("shared brain counter read must use signed session headers");
          if (!sync.includes("window.akiraHandleAuthFailure(401)")) throw new Error("shared brain counter must invalidate expired sessions");
          if (!missions.includes("window.missionPanelRenderList")) throw new Error("mission search render handler must be public to the HTML");
          if (missions.includes("getToken()")) throw new Error("missions must not call removed getToken helper");
          const brain3d = fs.readFileSync("js/akira_brain_3d.js", "utf8");
          const membrane = fs.readFileSync("js/obsidian_membrane.js", "utf8");
          if (!brain3d.includes("window.akiraBrainClearSelection3D")) throw new Error("3D selection clear hook missing");
          if (!membrane.includes("window.akiraBrainClearSelection3D()")) throw new Error("2D/3D selection clear bridge missing");
          if (!brain3d.includes("window.akiraBrainSetMode")) throw new Error("brain mode control missing");
          console.log("interactive UI integrity guard OK");
          NODE

      - name: Guard image error truthfulness
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("js/akira_brain.js", "utf8");
          const start = text.indexOf("async function generateImageAkira");
          const end = text.indexOf("\nfunction renderLevels", start);
          if (start < 0 || end < 0) throw new Error("generateImageAkira block not found");
          const block = text.slice(start, end);
          if (!block.includes("if(!r.ok)")) throw new Error("image handler must reject non-2xx responses");
          if (!block.includes("d.message || d.reason")) throw new Error("image error reason must surface to user");
          if (!block.includes("document.createElement(\"img\")")) throw new Error("image rendering should use DOM nodes");
          if (block.includes("✅ Imagen generada (revisa R2)")) throw new Error("stale false-success image message remains");
          console.log("image error truthfulness guard OK");
          NODE
