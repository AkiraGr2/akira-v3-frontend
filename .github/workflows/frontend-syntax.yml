name: Frontend syntax verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Brain and Learning JavaScript
        run: |
          node --check js/akira_brain_3d.js
          node --check js/obsidian_membrane.js
          node --check js/akira_learning.js
          node --check js/akira_brain.js
          node --check js/akira_missions_panel.js
          node --check js/akira_admin.js
          node --check js/akira_extras.js

      - name: Guard verified learning evaluation action
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("js/akira_learning.js", "utf8");
          const start = text.indexOf('}else if(status === "verified"){');
          const end = text.indexOf('}else if(status === "consolidated"){', start);
          if (start < 0 || end < 0) throw new Error("verified/consolidated blocks not found");
          const block = text.slice(start, end);
          if (!block.includes('data-learning-action="evaluate"')) {
            throw new Error("verified learning must expose EVALUAR when not sufficiently evaluated");
          }
          if (!block.includes('confidence < 0.70')) {
            throw new Error("verified learning evaluate gate threshold missing");
          }
          console.log("verified learning evaluation action guard OK");
          NODE

      - name: Guard runtime capability truth surface
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("index.html", "utf8");
          if (!text.includes("/api/v8/runtime/capabilities")) throw new Error("runtime capability endpoint must be consumed by frontend");
          if (!text.includes("function fetchRuntimeCapabilities()")) throw new Error("runtime capability fetch helper missing");
          if (!text.includes("window.akiraRuntimeCapabilities")) throw new Error("runtime capability state missing");
          if (!text.includes("runtimeStatus(runtime && runtime.image && runtime.image.status)")) throw new Error("image status must derive from runtime");
          if (!text.includes("runtimeStatus(runtime && runtime.pdf && runtime.pdf.status)")) throw new Error("pdf status must derive from runtime");
          if (!text.includes("runtimeStatus(runtime && runtime.video && runtime.video.status)")) throw new Error("video status must derive from runtime");
          console.log("runtime capability truth surface guard OK");
          NODE

      - name: Guard PDF upload error truthfulness
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("js/akira_extras.js", "utf8");
          const start = text.indexOf("async function uploadFileToAkira");
          const end = text.indexOf("\n// -------- 📝 Crear archivo --------", start);
          if (start < 0 || end < 0) throw new Error("uploadFileToAkira block not found");
          const block = text.slice(start, end);
          if (!block.includes("if(!r.ok || !d || d.ok !== true)")) throw new Error("PDF handler must reject non-2xx or non-ok backend responses");
          if (!block.includes("typeof d.text !== \"string\"")) throw new Error("PDF handler must validate returned text");
          if (!block.includes("d.message || d.reason")) throw new Error("PDF handler must surface backend reason");
          console.log("PDF upload error truthfulness guard OK");
          NODE


      - name: Guard signed-session UX contract
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const index = fs.readFileSync("index.html", "utf8");
          const admin = fs.readFileSync("js/akira_admin.js", "utf8");
          const missions = fs.readFileSync("js/akira_missions_panel.js", "utf8");
          const learning = fs.readFileSync("js/akira_learning.js", "utf8");
          const extras = fs.readFileSync("js/akira_extras.js", "utf8");
          const brain = fs.readFileSync("js/akira_brain.js", "utf8");
          if (!index.includes("function akiraVerifySession()")) throw new Error("central session verifier missing");
          if (!index.includes("function akiraClearSession(reason)")) throw new Error("central session clear helper missing");
          if (!index.includes("function akiraHandleAuthFailure(status)")) throw new Error("central 401 handler missing");
          if (!index.includes("/api/v8/me")) throw new Error("frontend session verifier must use /api/v8/me");
          if (index.includes('localStorage.setItem("akira_is_owner"')) throw new Error("owner state must not be persisted as local authority");
          if (index.includes('localStorage.getItem("akira_is_owner"')) throw new Error("owner state must not be read from localStorage");
          if (!index.includes('"akira_is_owner"') || !index.includes("localStorage.removeItem(k)")) throw new Error("legacy owner flag should be actively purged");
                    console.log("signed-session UX contract guard OK");
          NODE

      - name: Guard image error truthfulness
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("js/akira_brain.js", "utf8");
          const start = text.indexOf("async function generateImageAkira");
          const end = text.indexOf("\nfunction renderLevels", start);
          if (start < 0 || end < 0) throw new Error("generateImageAkira block not found");
          const block = text.slice(start, end);
          if (!block.includes("if(!r.ok)")) throw new Error("image handler must reject non-2xx responses");
          if (!block.includes("d.message || d.reason")) throw new Error("image error reason must surface to user");
          if (!block.includes("document.createElement(\"img\")")) throw new Error("image rendering should use DOM nodes");
          if (block.includes("✅ Imagen generada (revisa R2)")) throw new Error("stale false-success image message remains");
          console.log("image error truthfulness guard OK");
          NODE
