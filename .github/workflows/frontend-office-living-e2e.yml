name: Frontend living office E2E

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  office-living:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare local Office assets
        run: |
          set -euo pipefail
          mkdir -p assets/office assets/characters
          base1="https://raw.githubusercontent.com/yadneshSalvi/hearth-webmcp/617d6073a557cbc2f0f2ac917916e01b9c4b631b/public/assets/glb"
          base2="https://raw.githubusercontent.com/techdou/lumen-gallery/1c8a694c5669171b3b6a0f4bffc6f75d0772630a/public/assets/characters"
          for f in desk-kari.glb chair-olve.glb shelf-kant.glb floor-lamp-arc.glb plant-fern.glb armchair-kyst.glb table-rove.glb decor-vase.glb; do
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 "$base1/$f" -o "assets/office/$f"
            test -s "assets/office/$f"
          done
          for f in business-man.glb casual-woman.glb casual-man.glb worker.glb; do
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 "$base2/$f" -o "assets/characters/$f"
            test -s "assets/characters/$f"
          done

      - name: Serve checked-out frontend
        run: |
          python3 -m http.server 4173 --directory . > /tmp/akira-office-pages.log 2>&1 &
          echo $! > /tmp/akira-office-pages.pid
          sleep 2

      - name: Smoke test living Office
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({
              viewport:{width:1440,height:900},
              deviceScaleFactor:1
            });

            const errors = [];
            page.on("pageerror", err => errors.push(String(err && err.message || err)));

            await page.route("https://akira-empresa.onrender.com/api/v8/agents", route => {
              route.fulfill({
                status:200,
                contentType:"application/json",
                body:JSON.stringify({
                  agents:[
                    {name:"researcher",role:"researcher",status:"idle",allowed_tools:["web_search","memory_search","github_repo_read"]},
                    {name:"developer",role:"developer",status:"idle",allowed_tools:["github_repo_read","developer_propose"]},
                    {name:"tester",role:"tester",status:"idle",allowed_tools:["github_repo_read","python_test"]},
                    {name:"reviewer",role:"reviewer",status:"idle",allowed_tools:["github_repo_read","python_test","code_review"]},
                    {name:"memorizer",role:"memorizer",status:"idle",allowed_tools:["memory_save","memory_search"]},
                    {name:"graph_builder",role:"graph_builder",status:"idle",allowed_tools:["graph_create_node","graph_create_edge","graph_related"]},
                    {name:"learner",role:"learner",status:"idle",allowed_tools:["learning_save","memory_save"]},
                    {name:"internal",role:"internal",status:"idle",allowed_tools:["self_model_read","cognitive_cycle"]},
                    {name:"selftest_agent",role:"generic",status:"disabled",allowed_tools:["memory_save","memory_search"]}
                  ]
                })
              });
            });

            await page.route("https://akira-empresa.onrender.com/api/v8/tasks?limit=100", route => {
              route.fulfill({
                status:200,
                contentType:"application/json",
                body:JSON.stringify({
                  tasks:[
                    {agent_name:"researcher",status:"running",tool_name:"web_search",mission_id:"mission-e2e",created_at:"2026-10-04T23:00:00Z"},
                    {agent_name:"developer",status:"running",tool_name:"developer_propose",mission_id:"mission-e2e",created_at:"2026-10-04T23:01:00Z"},
                    {agent_name:"reviewer",status:"idle",tool_name:"code_review",created_at:"2026-10-04T22:59:00Z"}
                  ]
                })
              });
            });

            await page.goto("http://127.0.0.1:4173/", {
              waitUntil:"domcontentloaded",
              timeout:30000
            });

            await page.click("#btn-office");
            await page.waitForSelector("#officeCanvas", {state:"visible",timeout:10000});

            await page.waitForFunction(() => {
              return Boolean(
                window.akiraOfficeLivingDebug &&
                window.akiraOfficeLivingDebug.initialized
              );
            }, null, {timeout:30000});

            const localAssetChecks = await page.evaluate(async () => {
              const paths = [
                "assets/office/desk-kari.glb",
                "assets/office/chair-olve.glb",
                "assets/office/shelf-kant.glb",
                "assets/office/floor-lamp-arc.glb",
                "assets/office/plant-fern.glb",
                "assets/office/armchair-kyst.glb",
                "assets/office/table-rove.glb",
                "assets/office/decor-vase.glb",
                "assets/characters/business-man.glb",
                "assets/characters/casual-woman.glb",
                "assets/characters/casual-man.glb",
                "assets/characters/worker.glb"
              ];
              return Promise.all(paths.map(async path => {
                const r = await fetch(path, {cache:"no-store"});
                const b = new Uint8Array(await r.arrayBuffer());
                return {path,ok:r.ok,status:r.status,size:b.byteLength,magic:Array.from(b.slice(0,4))};
              }));
            });
            console.log("LOCAL_ASSET_CHECKS="+JSON.stringify(localAssetChecks));
            if(localAssetChecks.some(x => !x.ok || x.size < 16 || x.magic[0] !== 0x67 || x.magic[1] !== 0x6c || x.magic[2] !== 0x54 || x.magic[3] !== 0x46)){
              throw new Error("Published local GLB asset delivery check failed");
            }

            try{
              await page.waitForFunction(() => {
                const d = window.akiraOfficeLivingDebug;
                return Boolean(
                  d &&
                  d.agentCount === 9 &&
                  d.actorCount === 9 &&
                  d.modelCount >= 4 &&
                  d.officeAssetCount > 0 &&
                  d.officeAssetMode === true &&
                  d.modelKeys.includes("business") &&
                  d.modelKeys.includes("woman") &&
                  d.modelKeys.includes("hoodie") &&
                  d.modelKeys.includes("worker") &&
                  d.officeAssetKeys.includes("desk") &&
                  d.officeAssetKeys.includes("chair") &&
                  d.states.selftest_agent === "disabled" &&
                  ["researcher","developer","tester","reviewer","memorizer","graph_builder","learner","internal","selftest_agent"].every(name => Object.prototype.hasOwnProperty.call(d.states,name))
                );
              }, null, {timeout:60000});
            }catch(err){
              const debug = await page.evaluate(() => {
                const d = window.akiraOfficeLivingDebug;
                return d ? {
                  initialized:d.initialized,
                  agentCount:d.agentCount,
                  modelCount:d.modelCount,
                  modelKeys:d.modelKeys,
                  modelErrors:d.modelErrors,
                  modelTransports:d.modelTransports,
                  officeAssetCount:d.officeAssetCount,
                  officeAssetMode:d.officeAssetMode,
                  officeAssetKeys:d.officeAssetKeys,
                  officeAssetErrors:d.officeAssetErrors,
                  officeAssetTransports:d.officeAssetTransports,
                  actorCount:d.actorCount
                } : null;
              });
              console.log("OFFICE_DEBUG_TIMEOUT="+JSON.stringify(debug));
              throw err;
            }

            const transports = await page.evaluate(() => ({
              model: window.akiraOfficeLivingDebug.modelTransports,
              office: window.akiraOfficeLivingDebug.officeAssetTransports
            }));
            if(Object.values(transports.model).some(v => v !== "local")){
              throw new Error("Published-style local character assets were not used");
            }
            if(Object.values(transports.office).some(v => v !== "local")){
              throw new Error("Published-style local office assets were not used");
            }

            const refreshState = await page.evaluate(() => ({
              syncStatus: window.akiraOfficeLivingDebug.syncStatus,
              syncHttpStatus: window.akiraOfficeLivingDebug.syncHttpStatus,
              syncError: window.akiraOfficeLivingDebug.syncError
            }));

            if(refreshState.syncStatus !== "ok" || refreshState.syncHttpStatus !== 200 || refreshState.syncError !== ""){
              throw new Error("Office agent sync did not reach a clean success state after agents loaded: "+JSON.stringify(refreshState));
            }

            const plantMaterialColors = await page.evaluate(() => window.akiraOfficeLivingDebug.plantMaterialColors);
            if(!Array.isArray(plantMaterialColors) || !plantMaterialColors.length || plantMaterialColors.every(v => ["#ffffff","#fefefe","#fff"].includes(String(v).toLowerCase()))){
              throw new Error("Plant asset materials remain effectively white: "+JSON.stringify(plantMaterialColors));
            }

            const actorDiagnostics = await page.evaluate(() => window.akiraOfficeLivingDebug.actorDiagnostics);
            const actorEntries = Object.entries(actorDiagnostics || {});
            if(actorEntries.length !== 9){
              throw new Error("Expected diagnostics for all 9 persisted agents: "+JSON.stringify(actorDiagnostics));
            }
            for(const [name,diag] of actorEntries){
              const calibration=diag && diag.calibration || {};
              if(!Number.isFinite(calibration.height) || calibration.height < 1.35 || calibration.height > 2.05){
                throw new Error("Character calibration height out of bounds for "+name+": "+JSON.stringify(diag));
              }
              if(diag.activeClipBlocked){
                throw new Error("Character entered a blocked/fall/death/sleep clip for "+name+": "+JSON.stringify(diag));
              }
              if(!Array.isArray(diag.clipNames)){
                throw new Error("Character clip diagnostics missing for "+name);
              }
            }

            const states = await page.evaluate(() => window.akiraOfficeLivingDebug.states);
            if(states.researcher !== "briefing") throw new Error("Researcher should enter a real-task briefing state");
            if(states.developer !== "briefing") throw new Error("Developer should enter a real-task briefing state");

            const canvasBox = await page.$eval("#officeCanvas", el => {
              const r = el.getBoundingClientRect();
              return {width:r.width,height:r.height};
            });
            if(canvasBox.width < 300 || canvasBox.height < 300){
              throw new Error("Living Office canvas is too small");
            }

            await page.click("#officePause");
            const paused = await page.$eval("#officePause", el => ({
              text:el.textContent,
              pressed:el.getAttribute("aria-pressed")
            }));
            if(paused.pressed !== "true" || paused.text !== "Reanudar"){
              throw new Error("Office pause control did not enter paused state");
            }

            await page.click("#officePause");
            const resumed = await page.$eval("#officePause", el => ({
              text:el.textContent,
              pressed:el.getAttribute("aria-pressed")
            }));
            if(resumed.pressed !== "false" || resumed.text !== "Pausar"){
              throw new Error("Office pause control did not resume");
            }

            if(errors.length){
              throw new Error("Unexpected page errors: " + errors.slice(0,5).join(" | "));
            }

            console.log("OFFICE_LIVING_E2E_PASS local_assets=true");
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
