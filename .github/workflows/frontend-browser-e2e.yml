name: Frontend browser E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@latest

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve checked-out frontend
        run: |
          python3 -m http.server 4173 --directory . > /tmp/akira-pages.log 2>&1 &
          echo $! > /tmp/akira-pages.pid
          sleep 2

      - name: Smoke test checked-out Brain 2D
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:900}, deviceScaleFactor:1});
            const errors = [];
            page.on("pageerror", err => errors.push(String(err && err.message || err)));

            await page.route("**/api/v8/graph/overview**", async route => {
              await route.fulfill({
                status:200,
                contentType:"application/json",
                body:JSON.stringify({
                  ok:true,
                  nodes:[
                    {id:"node_akira_e2e",label:"Akira",node_type:"project",weight:1,confidence:1,reuse_count:1},
                    {id:"node_memory_e2e",label:"memory:e2e",node_type:"experience",weight:1,confidence:.8,reuse_count:1},
                    {id:"node_agent_e2e",label:"agent:e2e",node_type:"agent",weight:.8,confidence:.8,reuse_count:1}
                  ],
                  edges:[
                    {id:"edge_e2e_1",from_node:"node_akira_e2e",to_node:"node_memory_e2e",relation_type:"related_to",weight:1,frequency:1},
                    {id:"edge_e2e_2",from_node:"node_akira_e2e",to_node:"node_agent_e2e",relation_type:"related_to",weight:.8,frequency:1}
                  ],
                  counts:{nodes:3,edges:2,by_type:{project:1,experience:1,agent:1},by_relation:{related_to:2}}
                })
              });
            });

            await page.goto("http://127.0.0.1:4173/", {waitUntil:"domcontentloaded",timeout:30000});
            await page.click("#btn-membrane");
            await page.waitForSelector("#membraneCy canvas",{state:"visible",timeout:15000});

            if(await page.$("#brainMode3d") || await page.$("#membrane3d")){
              throw new Error("3D Brain surface must not exist");
            }

            await page.waitForFunction(() => {
              const stats=document.getElementById("membraneStats");
              return stats && stats.textContent.includes("3 nodos") && stats.textContent.includes("2 aristas");
            }, null,{timeout:10000});

            if(errors.length){
              throw new Error("Unexpected Brain page errors: "+errors.slice(0,5).join(" | "));
            }

            console.log("BRAIN_2D_SMOKE_PASS");
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Smoke test Office 2D route commands
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:900}, deviceScaleFactor:1});
            const errors = [];
            page.on("pageerror", err => errors.push(String(err && err.message || err)));

            await page.route("**/api/v8/agents**", async route => {
              const names=["Akira","Luna","Nexo","Nova","Orion","Kaori","Zeri","Lyra","Dante"];
              await route.fulfill({
                status:200,
                contentType:"application/json",
                body:JSON.stringify({
                  ok:true,
                  agents:names.map(name=>({name,status:name==="Dante"?"disabled":"idle"}))
                })
              });
            });

            await page.route("**/api/v8/tasks**", async route => {
              await route.fulfill({
                status:200,
                contentType:"application/json",
                body:JSON.stringify({ok:true,tasks:[]})
              });
            });

            await page.goto("http://127.0.0.1:4173/", {waitUntil:"domcontentloaded",timeout:30000});
            await page.click("#btn-office");
            await page.waitForFunction(() =>
              Boolean(window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.initialized),
              null,{timeout:15000}
            );

            await page.click("#officePixelMission");
            await page.waitForFunction(() => {
              const agents=window.akiraOfficePixelDebug.agents||[];
              const akira=agents.find(a=>a.name==="Akira");
              return !!akira && ["walking","station"].includes(akira.machine);
            }, null,{timeout:10000});

            await page.click("#officePixelCoffee");
            await page.waitForFunction(() => {
              const agents=window.akiraOfficePixelDebug.agents||[];
              return agents.filter(a=>["walking","station"].includes(a.machine)).length >= 1;
            }, null,{timeout:10000});

            await page.click("#officePixelPrint");
            await page.waitForFunction(() => {
              const agents=window.akiraOfficePixelDebug.agents||[];
              const nexo=agents.find(a=>a.name==="Nexo");
              return !!nexo && ["walking","station"].includes(nexo.machine);
            }, null,{timeout:10000});

            await page.click("#officePixelMeeting");
            await page.waitForFunction(() => {
              const agents=window.akiraOfficePixelDebug.agents||[];
              return agents.filter(a=>a.machine==="walking").length >= 1;
            }, null,{timeout:10000});

            if(errors.length){
              throw new Error("Unexpected Office page errors: "+errors.slice(0,5).join(" | "));
            }

            console.log("OFFICE_ROUTE_COMMANDS_SMOKE_PASS");
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
