name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Download pinned Office assets
        run: |
          set -euo pipefail
          mkdir -p assets/office assets/characters
          base1="https://raw.githubusercontent.com/yadneshSalvi/hearth-webmcp/617d6073a557cbc2f0f2ac917916e01b9c4b631b/public/assets/glb"
          base2="https://raw.githubusercontent.com/techdou/lumen-gallery/1c8a694c5669171b3b6a0f4bffc6f75d0772630a/public/assets/characters"
          for f in desk-kari.glb chair-olve.glb shelf-kant.glb floor-lamp-arc.glb plant-fern.glb armchair-kyst.glb table-rove.glb decor-vase.glb sofa-liva.glb wardrobe-hald.glb rug-loop.glb table-lamp-alva.glb plant-fig.glb plant-palm.glb decor-bowl.glb decor-sculpture.glb table-ake.glb chair-finn.glb; do
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 "$base1/$f" -o "assets/office/$f"
            test -s "assets/office/$f"
          done
          for f in business-man.glb casual-woman.glb casual-man.glb worker.glb; do
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 "$base2/$f" -o "assets/characters/$f"
            test -s "assets/characters/$f"
          done
      - name: Stamp deployment marker
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > akira-deploy-commit.txt
          python3 - <<'PY'
          import json, os
          p = "build-version.json"
          data = {}
          try:
              with open(p, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              data = {}
          data["version"] = os.environ["GITHUB_SHA"]
          data["generated_at"] = os.environ.get("GITHUB_RUN_STARTED_AT", "")
          with open(p, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages deployment
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          url="${base}akira-deploy-commit.txt?verify=${GITHUB_SHA}"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$url" -o /tmp/akira-live-marker.txt; then
              live="$(tr -d '\r\n' < /tmp/akira-live-marker.txt)"
              if [ "$live" = "$GITHUB_SHA" ]; then
                echo "PAGES_LIVE_VERIFY_PASS $live"
                exit 0
              fi
              echo "Live Pages marker mismatch: expected $GITHUB_SHA got $live (attempt $attempt)"
            else
              echo "Live Pages marker not available yet (attempt $attempt)"
            fi
            sleep 5
          done
          echo "GitHub Pages did not expose the deployed commit marker after retries." >&2
          exit 1

