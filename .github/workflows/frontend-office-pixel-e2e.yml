name: Frontend Pixel Office E2E

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/office/**"
      - ".github/workflows/frontend-office-pixel-e2e.yml"
  pull_request:
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/office/**"
      - ".github/workflows/frontend-office-pixel-e2e.yml"
  workflow_dispatch:

jobs:
  office-pixel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve checked-out frontend
        run: |
          python3 -m http.server 4173 --directory . > /tmp/akira-office-pages.log 2>&1 &
          echo $! > /tmp/akira-office-pages.pid
          sleep 2

      - name: Smoke test Pixel Office
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({headless:true});

            const errors = [];
            const page = await browser.newPage({
              viewport:{width:1440,height:900},
              deviceScaleFactor:1
            });
            page.on("pageerror", err => errors.push(String(err && err.message || err)));

            await page.route("https://akira-empresa.onrender.com/api/v8/agents", route => {
              route.fulfill({
                status:200,
                contentType:"application/json",
                body:JSON.stringify({
                  agents:[
                    {name:"researcher",role:"researcher",status:"idle",allowed_tools:["web_search"]},
                    {name:"developer",role:"developer",status:"idle",allowed_tools:["developer_propose"]},
                    {name:"tester",role:"tester",status:"idle",allowed_tools:["python_test"]},
                    {name:"reviewer",role:"reviewer",status:"idle",allowed_tools:["code_review"]},
                    {name:"memorizer",role:"memorizer",status:"idle",allowed_tools:["memory_save"]},
                    {name:"graph_builder",role:"graph_builder",status:"idle",allowed_tools:["graph_create_node"]},
                    {name:"learner",role:"learner",status:"idle",allowed_tools:["learning_save"]},
                    {name:"internal",role:"internal",status:"idle",allowed_tools:["self_model_read"]},
                    {name:"selftest_agent",role:"generic",status:"disabled",allowed_tools:[]}
                  ]
                })
              });
            });

            await page.route("https://akira-empresa.onrender.com/api/v8/tasks?limit=100", route => {
              route.fulfill({
                status:200,
                contentType:"application/json",
                body:JSON.stringify({
                  tasks:[
                    {agent_name:"researcher",status:"running",tool_name:"web_search",mission_id:"mission-e2e",created_at:"2026-10-04T23:00:00Z"},
                    {agent_name:"developer",status:"running",tool_name:"developer_propose",mission_id:"mission-e2e",created_at:"2026-10-04T23:01:00Z"}
                  ]
                })
              });
            });

            await page.goto("http://127.0.0.1:4173/", {
              waitUntil:"domcontentloaded",
              timeout:30000
            });

            await page.click("#btn-office");
            await page.waitForSelector("#officePixelCanvas", {state:"visible",timeout:10000});

            // Now exercise the actual mobile layout after the section is open.
            await page.setViewportSize({width:390,height:844});
            await page.waitForFunction(() => {
              const canvas=document.getElementById("officePixelCanvas");
              const stage=document.getElementById("officePixelStage");
              if(!canvas || !stage) return false;
              const c=canvas.getBoundingClientRect();
              return c.width>300 && c.height>220 && Boolean(window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.sceneSource.endsWith("01_office_scene_clean_v3.png"));
            }, null, {timeout:20000});

            const domState=await page.evaluate(() => ({
              office3dStage:document.getElementById("office3dStage"),
              office3dMode:document.getElementById("office3dMode"),
              officeCanvas:document.getElementById("officeCanvas"),
              legacyFloor3dScript:[...document.scripts].some(s=>String(s.src).includes("akira-office-floor")),
              pixelScript:[...document.scripts].some(s=>String(s.src).includes("akira-office-living-v3")),
              sceneSource:window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.sceneSource,
              atlasSource:window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.atlasSource,
              atlasLayout:window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.atlasLayout,
              agents:window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.agents,
              invalidEdges:window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.invalidEdges
            }));

            if(domState.office3dStage || domState.office3dMode || domState.officeCanvas || domState.legacyFloor3dScript){
              throw new Error("3D Office elements/scripts are still present: "+JSON.stringify(domState));
            }
            if(!domState.pixelScript) throw new Error("Living Pixel Office V3 script is not loaded");
            if(!String(domState.sceneSource||"").endsWith("01_office_scene_clean_v3.png")){
              throw new Error("Clean V3 Office scene was not loaded: "+JSON.stringify(domState.sceneSource));
            }
            if(!String(domState.atlasSource||"").endsWith("02_office_agents_atlas_v3_clean4.png")){
              throw new Error("V3 clean4 agent atlas was not loaded: "+JSON.stringify(domState.atlasSource));
            }
            if(!domState.atlasLayout || domState.atlasLayout.rows!==9 || domState.atlasLayout.framesPerRow!==19){
              throw new Error("Clean4 atlas layout contract is wrong: "+JSON.stringify(domState.atlasLayout));
            }
            if(Array.isArray(domState.invalidEdges) && domState.invalidEdges.length){
              throw new Error("Collision guard rejected movement edges: "+JSON.stringify(domState.invalidEdges));
            }
            const agentByName=Object.fromEntries((domState.agents||[]).map(a=>[a.name,a]));
            if(!agentByName.Luna || agentByName.Luna.backendState!=="working" ||
               !agentByName.Nexo || agentByName.Nexo.backendState!=="working" ||
               !agentByName.Dante){
              throw new Error("Pixel Office state synchronization failed: "+JSON.stringify(domState.agents));
            }

            if(Array.isArray(domState.invalidEdges) && domState.invalidEdges.length){
              throw new Error("Collision guard rejected movement edges: "+JSON.stringify(domState.invalidEdges));
            }

            const allHomes=(domState.agents||[]).map(a=>a.name);
            if(allHomes.length!==9){
              throw new Error("Office roster is not 9 agents: "+JSON.stringify(allHomes));
            }

            const assets=await page.evaluate(async () => {
              const paths=[
                "assets/office/01_office_scene_clean_v3.png",
                "assets/office/02_office_agents_atlas_v3_clean4.png",
                "assets/office/02_office_ui_reference.png",
                "assets/office/03_office_production_map.png",
                "assets/office/04_office_map_objects_and_zones.png",
                "assets/office/05_office_assets_and_spritesheets.png"
              ];
              return Promise.all(paths.map(async path => {
                const r=await fetch(path,{cache:"no-store"});
                const b=new Uint8Array(await r.arrayBuffer());
                return {path,ok:r.ok,status:r.status,size:b.byteLength,signature:Array.from(b.slice(0,8))};
              }));
            });

            if(assets.some(x=>!x.ok || x.size<100 || x.signature[0]!==137 || x.signature[1]!==80 || x.signature[2]!==78 || x.signature[3]!==71)){
              throw new Error("Authored Pixel Office asset delivery failed: "+JSON.stringify(assets));
            }

            const layout=await page.$eval("#officePixelCanvas",el=>{
              const r=el.getBoundingClientRect();
              const stage=document.getElementById("officePixelStage").getBoundingClientRect();
              const ctx=el.getContext("2d");
              const sample=ctx ? Array.from(ctx.getImageData(12,12,1,1).data) : [];
              return {canvas:{width:r.width,height:r.height},stage:{top:stage.top,bottom:stage.bottom},sample};
            });

            if(layout.canvas.width<300 || layout.canvas.height<220){
              throw new Error("Pixel Office canvas is too small: "+JSON.stringify(layout.canvas));
            }
            if(!layout.sample.length || layout.sample[3]===0){
              throw new Error("Pixel Office canvas did not paint");
            }

            const frameBefore=await page.evaluate(() => (window.akiraOfficePixelDebug.agents||[]).find(a=>a.name==="Akira"));
            await page.waitForTimeout(500);
            const frameAfter=await page.evaluate(() => (window.akiraOfficePixelDebug.agents||[]).find(a=>a.name==="Akira"));
            if(!frameBefore || !frameAfter){
              throw new Error("Akira sprite debug state missing");
            }

            await page.setViewportSize({width:1440,height:900});
            await page.waitForFunction(() => {
              const canvas=document.getElementById("officePixelCanvas");
              return canvas && canvas.getBoundingClientRect().width>500;
            }, null, {timeout:10000});

            const before=await page.evaluate(() => {
              const a=(window.akiraOfficePixelDebug.agents||[]).find(x=>x.name==="Akira");
              return a ? {world:[...a.world],state:a.state} : null;
            });
            await page.evaluate(() => window.akiraOfficePixelCommand("mission"));
            await page.waitForFunction((beforeWorld) => {
              const a=(window.akiraOfficePixelDebug.agents||[]).find(x=>x.name==="Akira");
              if(!a)return false;
              const moved=Math.abs(a.world[0]-beforeWorld[0])>0.01 || Math.abs(a.world[1]-beforeWorld[1])>0.01;
              return moved && (a.state==="walk" || a.state==="use" || a.state==="idle");
            }, before.world, {timeout:12000});

            const after=await page.evaluate(() => {
              const a=(window.akiraOfficePixelDebug.agents||[]).find(x=>x.name==="Akira");
              return a ? {world:[...a.world],state:a.state} : null;
            });
            if(!before || !after) throw new Error("Akira debug state missing");
            if(before.world[0]===after.world[0] && before.world[1]===after.world[1]){
              throw new Error("Akira did not move after Mission command");
            }

            await page.click("#officeRefresh");
            await page.click("#officePause");
            const paused=await page.$eval("#officePause",el=>({text:el.textContent,pressed:el.getAttribute("aria-pressed")}));
            if(paused.text!=="Reanudar" || paused.pressed!=="true"){
              throw new Error("Pixel Office pause control failed");
            }
            await page.click("#officePause");
            const resumed=await page.$eval("#officePause",el=>({text:el.textContent,pressed:el.getAttribute("aria-pressed")}));
            if(resumed.text!=="Pausar" || resumed.pressed!=="false"){
              throw new Error("Pixel Office resume control failed");
            }

            if(errors.length) throw new Error("Unexpected page errors: "+errors.slice(0,5).join(" | "));

            console.log("PIXEL_OFFICE_E2E_PASS clean_scene=true authored_atlas=true sprite_movement=true office_3d=false");
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
