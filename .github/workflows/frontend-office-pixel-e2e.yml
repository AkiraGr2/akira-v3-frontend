name: Frontend Pixel Office E2E

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/office/**"
      - ".github/workflows/frontend-office-pixel-e2e.yml"
  pull_request:
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/office/**"
      - ".github/workflows/frontend-office-pixel-e2e.yml"
  workflow_dispatch:

jobs:
  office-pixel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve checked-out frontend
        run: |
          python3 -m http.server 4173 --directory . > /tmp/akira-office-pages.log 2>&1 &
          echo $! > /tmp/akira-office-pages.pid
          sleep 2

      - name: Smoke test Pixel Office
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({headless:true});

            const errors = [];
            const page = await browser.newPage({
              // Start mobile-first so the responsive Office contract is tested
              // from a clean navigation rather than a live viewport mutation.
              viewport:{width:390,height:844},
              deviceScaleFactor:1
            });
            page.on("pageerror", err => errors.push(String(err && err.message || err)));

            await page.route("https://akira-empresa.onrender.com/api/v8/agents", route => {
              route.fulfill({
                status:200,
                contentType:"application/json",
                body:JSON.stringify({
                  agents:[
                    {name:"researcher",role:"researcher",status:"idle",allowed_tools:["web_search"]},
                    {name:"developer",role:"developer",status:"idle",allowed_tools:["developer_propose"]},
                    {name:"tester",role:"tester",status:"idle",allowed_tools:["python_test"]},
                    {name:"reviewer",role:"reviewer",status:"idle",allowed_tools:["code_review"]},
                    {name:"memorizer",role:"memorizer",status:"idle",allowed_tools:["memory_save"]},
                    {name:"graph_builder",role:"graph_builder",status:"idle",allowed_tools:["graph_create_node"]},
                    {name:"learner",role:"learner",status:"idle",allowed_tools:["learning_save"]},
                    {name:"internal",role:"internal",status:"idle",allowed_tools:["self_model_read"]},
                    {name:"selftest_agent",role:"generic",status:"disabled",allowed_tools:[]}
                  ]
                })
              });
            });

            await page.route("https://akira-empresa.onrender.com/api/v8/tasks?limit=100", route => {
              route.fulfill({
                status:200,
                contentType:"application/json",
                body:JSON.stringify({
                  tasks:[
                    {agent_name:"researcher",status:"running",tool_name:"web_search",mission_id:"mission-e2e",created_at:"2026-10-04T23:00:00Z"},
                    {agent_name:"developer",status:"running",tool_name:"developer_propose",mission_id:"mission-e2e",created_at:"2026-10-04T23:01:00Z"}
                  ]
                })
              });
            });

            await page.goto("http://127.0.0.1:4173/", {
              waitUntil:"domcontentloaded",
              timeout:30000
            });

            await page.click("#btn-office");
            await page.waitForSelector("#officePixelCanvas", {state:"visible",timeout:10000});

            // The page was opened at the mobile viewport from the start.
            await page.waitForFunction(() => {
              const canvas=document.getElementById("officePixelCanvas");
              const stage=document.getElementById("officePixelStage");
              if(!canvas || !stage) return false;
              const c=canvas.getBoundingClientRect();
              return c.width>300 && c.height>220 && Boolean(window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.sceneSource.endsWith("01_akira_office_floor_v5_doors.png"));
            }, null, {timeout:40000});

            const domState=await page.evaluate(() => ({
              office3dStage:document.getElementById("office3dStage"),
              office3dMode:document.getElementById("office3dMode"),
              officeCanvas:document.getElementById("officeCanvas"),
              legacyFloor3dScript:[...document.scripts].some(s=>String(s.src).includes("akira-office-floor")),
              pixelScript:[...document.scripts].some(s=>String(s.src).includes("akira-office-living-v5")),
              sceneSource:window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.sceneSource,
              atlasSource:window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.atlasSource,
              atlasLayout:window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.atlasLayout,
              agents:window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.agents,
              invalidEdges:window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.invalidEdges,
              navigationMode:window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.navigationMode,
              walkSpeed:window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.walkSpeed,
              grid:window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.grid
            }));

            if(domState.office3dStage || domState.office3dMode || domState.officeCanvas || domState.legacyFloor3dScript){
              throw new Error("3D Office elements/scripts are still present: "+JSON.stringify(domState));
            }
            if(!domState.pixelScript) throw new Error("Living Pixel Office V5 script is not loaded");
            if(!String(domState.sceneSource||"").endsWith("01_akira_office_floor_v5_doors.png")){
              throw new Error("Clean V3 Akira V5 office floor was not loaded: "+JSON.stringify(domState.sceneSource));
            }
            if(!String(domState.atlasSource||"").endsWith("02_office_agents_atlas_v3_clean4.png")){
              throw new Error("V3 clean4 agent atlas was not loaded: "+JSON.stringify(domState.atlasSource));
            }
            if(!domState.atlasLayout || domState.atlasLayout.rows!==9 || domState.atlasLayout.framesPerRow!==19){
              throw new Error("Clean4 atlas layout contract is wrong: "+JSON.stringify(domState.atlasLayout));
            }
            if(domState.navigationMode!=="grid-a-star-semantic-v6" || !(domState.walkSpeed>0 && domState.walkSpeed<120)){
              throw new Error("Realistic screen navigation contract failed: "+JSON.stringify({mode:domState.navigationMode,speed:domState.walkSpeed}));
            }
            const agentByName=Object.fromEntries((domState.agents||[]).map(a=>[a.name,a]));
            if(Object.keys(agentByName).length!==9 || !agentByName.Dante){
              throw new Error("Pixel Office roster contract failed: "+JSON.stringify(domState.agents));
            }

            const animPhases=(domState.agents||[])
              .filter(a=>a.name!=="Dante")
              .map(a=>a.animPhaseMs);
            if(new Set(animPhases).size<4){
              throw new Error("Pixel Office animation phases are too synchronized: "+JSON.stringify(animPhases));
            }

            if(domState.navigationMode!=="grid-a-star-semantic-v6"){
              throw new Error("Grid/station navigation is not active: "+JSON.stringify(domState.navigationMode));
            }
            if(!domState.grid || domState.grid.width!==48 || domState.grid.height!==32 || domState.grid.tile!==32){
              throw new Error("V5 navigation grid contract failed: "+JSON.stringify(domState.grid));
            }

            const collisionContract=await page.evaluate(() => window.akiraOfficePixelDebug && window.akiraOfficePixelDebug.collisionContract);
            if(!collisionContract || !collisionContract.enabled || !collisionContract.dynamicPrediction ||
               !collisionContract.staticCollisionAware || collisionContract.minGapPx<30){
              throw new Error("Dynamic agent collision contract failed: "+JSON.stringify(collisionContract));
            }

            const collisionProbe=await page.evaluate(() => window.akiraOfficePixelDebug.runCollisionProbe());
            if(!collisionProbe || !collisionProbe.ok || !collisionProbe.prevented ||
               collisionProbe.nextGap<collisionProbe.minGapPx){
              throw new Error("Agent collision probe failed: "+JSON.stringify(collisionProbe));
            }

            const deadlockProbe=await page.evaluate(() => window.akiraOfficePixelDebug.runCollisionDeadlockProbe());
            if(!deadlockProbe || !deadlockProbe.ok || !deadlockProbe.yielded ||
               !deadlockProbe.progressed || !deadlockProbe.separated ||
               deadlockProbe.minGap<deadlockProbe.requiredGap){
              throw new Error("Agent collision deadlock recovery failed: "+JSON.stringify(deadlockProbe));
            }

            const taskStationState=await page.evaluate(() => window.akiraOfficePixelDebug.agents);
            const taskByName=Object.fromEntries((taskStationState||[]).map(a=>[a.name,a]));
            if(taskByName.Luna?.taskStation!=="web" || taskByName.Nexo?.taskStation!=="development"){
              throw new Error("Real-task station routing contract failed: "+JSON.stringify({
                Luna:taskByName.Luna,
                Nexo:taskByName.Nexo
              }));
            }
            if((taskStationState||[]).filter(a=>a.name!=="Dante").some(a=>!a.roleStation)){
              throw new Error("One or more active agents lack a deterministic role station: "+JSON.stringify(taskStationState));
            }

            const allHomes=(domState.agents||[]).map(a=>a.name);
            if(allHomes.length!==9){
              throw new Error("Office roster is not 9 agents: "+JSON.stringify(allHomes));
            }

            const assets=await page.evaluate(async () => {
              const paths=[
                "assets/office/01_akira_office_floor_v5_doors.png",
                "assets/office/02_akira_office_assets_v5.png",
                "assets/office/02_office_agents_atlas_v3_clean4.png",
                "assets/office/02_office_ui_reference.png",
                "assets/office/03_office_production_map.png",
                "assets/office/04_office_map_objects_and_zones.png",
                "assets/office/05_office_assets_and_spritesheets.png"
              ];
              return Promise.all(paths.map(async path => {
                const r=await fetch(path,{cache:"no-store"});
                const b=new Uint8Array(await r.arrayBuffer());
                return {path,ok:r.ok,status:r.status,size:b.byteLength,signature:Array.from(b.slice(0,8))};
              }));
            });

            if(assets.some(x=>!x.ok || x.size<100 || x.signature[0]!==137 || x.signature[1]!==80 || x.signature[2]!==78 || x.signature[3]!==71)){
              throw new Error("Authored Pixel Office asset delivery failed: "+JSON.stringify(assets));
            }
            if(!assets.find(x=>x.path==="assets/office/02_akira_office_assets_v5.png" && x.ok && x.size>100)){
              throw new Error("Akira V5 supplemental asset sheet delivery failed: "+JSON.stringify(assets));
            }
            const runtimeConfig=await page.evaluate(async () => {
              const r=await fetch("assets/office/office_runtime_v5.json",{cache:"no-store"});
              return {ok:r.ok,data:r.ok?await r.json():null};
            });
            if(!runtimeConfig.ok || !runtimeConfig.data || !Array.isArray(runtimeConfig.data.doors) || runtimeConfig.data.doors.length < 8){
              throw new Error("V5 runtime door contract failed: "+JSON.stringify(runtimeConfig));
            }

            const layout=await page.$eval("#officePixelCanvas",el=>{
              const r=el.getBoundingClientRect();
              const stage=document.getElementById("officePixelStage").getBoundingClientRect();
              const ctx=el.getContext("2d");
              const sample=ctx ? Array.from(ctx.getImageData(12,12,1,1).data) : [];
              return {canvas:{width:r.width,height:r.height},stage:{top:stage.top,bottom:stage.bottom},sample};
            });

            if(layout.canvas.width<300 || layout.canvas.height<220){
              throw new Error("Pixel Office canvas is too small: "+JSON.stringify(layout.canvas));
            }
            if(!layout.sample.length || layout.sample[3]===0){
              throw new Error("Pixel Office canvas did not paint");
            }

            const frameBefore=await page.evaluate(() => (window.akiraOfficePixelDebug.agents||[]).find(a=>a.name==="Akira"));
            await page.waitForTimeout(500);
            const frameAfter=await page.evaluate(() => (window.akiraOfficePixelDebug.agents||[]).find(a=>a.name==="Akira"));
            if(!frameBefore || !frameAfter){
              throw new Error("Akira sprite debug state missing");
            }

            // Reopen the checked-out application at desktop width before
            // testing movement and multi-agent choreography. This avoids making
            // responsive layout behavior depend on a live canvas resize.
            await page.setViewportSize({width:1440,height:900});
            await page.goto("http://127.0.0.1:4173/", {
              waitUntil:"domcontentloaded",
              timeout:30000
            });
            await page.click("#btn-office");
            await page.waitForSelector("#officePixelCanvas", {state:"visible",timeout:10000});
            await page.waitForFunction(() => {
              const canvas=document.getElementById("officePixelCanvas");
              return canvas && canvas.getBoundingClientRect().width>500;
            }, null, {timeout:10000});

            const before=await page.evaluate(() => {
              const a=(window.akiraOfficePixelDebug.agents||[]).find(x=>x.name==="Akira");
              return a ? {world:[...a.world],screen:[...a.screen],state:a.state} : null;
            });
            await page.evaluate(() => window.akiraOfficePixelCommand("mission"));
            await page.waitForFunction((beforeScreen) => {
              const a=(window.akiraOfficePixelDebug.agents||[]).find(x=>x.name==="Akira");
              if(!a)return false;
              const moved=Math.hypot(a.screen[0]-beforeScreen[0],a.screen[1]-beforeScreen[1])>8;
              return moved && (a.state==="walk" || a.state==="use" || a.state==="idle");
            }, before.screen, {timeout:12000});

            const after=await page.evaluate(() => {
              const a=(window.akiraOfficePixelDebug.agents||[]).find(x=>x.name==="Akira");
              return a ? {world:[...a.world],screen:[...a.screen],state:a.state,phase:a.phase} : null;
            });
            const pixelTravel=Math.hypot(after.screen[0]-before.screen[0],after.screen[1]-before.screen[1]);

            // Selection contract: both the lower agent list and the avatar itself
            // must populate the same detail panel, and the selection must survive
            // the periodic backend refresh that rebuilds the list DOM.
            const lunaRow=page.locator('#officeAgentList [data-office-agent="Luna"]');
            await lunaRow.scrollIntoViewIfNeeded();
            await lunaRow.click();
            await page.waitForFunction(() => {
              const detail=document.getElementById("officeAgentDetail");
              return detail && detail.textContent.includes("Luna") &&
                     document.querySelector('#officeAgentList [data-office-agent="Luna"].is-selected');
            }, null, {timeout:5000});

            await page.waitForTimeout(5200);
            const persistedSelection=await page.evaluate(() => ({
              detail:document.getElementById("officeAgentDetail")?.textContent||"",
              selected:Boolean(document.querySelector('#officeAgentList [data-office-agent="Luna"].is-selected'))
            }));
            if(!persistedSelection.detail.includes("Luna") || !persistedSelection.selected){
              throw new Error("Agent list selection did not persist: "+JSON.stringify(persistedSelection));
            }

            const lunaScreen=await page.evaluate(() => {
              const a=(window.akiraOfficePixelDebug.agents||[]).find(x=>x.name==="Luna");
              return a ? [...a.screen] : null;
            });
            const canvasBox=await page.locator("#officePixelCanvas").boundingBox();
            if(!lunaScreen || !canvasBox) throw new Error("Could not resolve Luna canvas selection coordinates");
            await page.mouse.click(
              canvasBox.x + lunaScreen[0]/1536*canvasBox.width,
              canvasBox.y + lunaScreen[1]/1024*canvasBox.height
            );
            await page.waitForFunction(() => {
              const detail=document.getElementById("officeAgentDetail");
              return detail && detail.textContent.includes("Luna");
            }, null, {timeout:5000});
            if(pixelTravel>1200){
              throw new Error("Akira moved implausibly fast/far: "+pixelTravel);
            }
            if(!before || !after) throw new Error("Akira debug state missing");
            if(Math.hypot(after.screen[0]-before.screen[0],after.screen[1]-before.screen[1])<=8){
              throw new Error("Akira did not move after Mission command: "+JSON.stringify({before,after}));
            }

            await page.evaluate(() => window.akiraOfficePixelCommand("meeting"));
            const meetingGaps=[];
            for(let i=0;i<12;i++){
              await page.waitForTimeout(250);
              const snapshot=await page.evaluate(() => (window.akiraOfficePixelDebug.agents||[])
                .filter(a=>a.name!=="Dante" && a.status!=="disabled")
                .map(a=>({name:a.name,screen:[...a.screen],state:a.state,machine:a.machine})));
              let minGap=Infinity;
              for(let a=0;a<snapshot.length;a++){
                for(let b=a+1;b<snapshot.length;b++){
                  minGap=Math.min(minGap,Math.hypot(
                    snapshot[a].screen[0]-snapshot[b].screen[0],
                    snapshot[a].screen[1]-snapshot[b].screen[1]
                  ));
                }
              }
              meetingGaps.push({t:(i+1)*250,minGap,waiting:snapshot.filter(a=>a.waitingForAgent).length});
            }
            const contract=await page.evaluate(() => window.akiraOfficePixelDebug.collisionContract);
            if(!contract || meetingGaps.some(x=>x.minGap < contract.minGapPx-2)){
              throw new Error("Meeting collision sweep failed: "+JSON.stringify({contract,meetingGaps}));
            }

            await page.click("#officeRefresh");
            await page.click("#officePause");
            const paused=await page.$eval("#officePause",el=>({text:el.textContent,pressed:el.getAttribute("aria-pressed")}));
            if(paused.text!=="Reanudar" || paused.pressed!=="true"){
              throw new Error("Pixel Office pause control failed");
            }
            await page.click("#officePause");
            const resumed=await page.$eval("#officePause",el=>({text:el.textContent,pressed:el.getAttribute("aria-pressed")}));
            if(resumed.text!=="Pausar" || resumed.pressed!=="false"){
              throw new Error("Pixel Office resume control failed");
            }

            if(errors.length) throw new Error("Unexpected page errors: "+errors.slice(0,5).join(" | "));

            console.log("PIXEL_OFFICE_E2E_PASS clean_scene=true authored_atlas=true sprite_movement=true office_3d=false");
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
